# Install to /etc/tmpfiles.d/wan_healthcheck.conf, then apply with:
#   systemd-tmpfiles --create /etc/tmpfiles.d/wan_healthcheck.conf
#
# Everything lives on /run (tmpfs) on purpose: a reboot wipes the drop-ins
# and resets the weight, so the whole mechanism is fail-open.

# The keepalived track file. Seeding it as 0 matters - if it does not exist
# when keepalived starts, keepalived logs "track file ... not found,
# ignoring" and runs untracked, so nothing fails over.
d /run/wan_healthcheck 0755 wan_healthcheck wan_healthcheck -
f /run/wan_healthcheck/wan_weight 0644 wan_healthcheck wan_healthcheck - 0

# One drop-in directory per --ra-interface, owned by the daemon.
# /run/systemd/network is root-owned and the daemon is not root, so it can
# only create the file inside a directory that already exists with the right
# owner. The name is the interface's .network filename plus ".d" - find it:
#   networkctl --json=short status lan0 |
#     python3 -c 'import json,sys; print(json.load(sys.stdin)["NetworkFile"])'
# Armed router only; a --dry-run backup does not need these.
d /run/systemd/network/10-lan0.network.d 0755 wan_healthcheck wan_healthcheck -
