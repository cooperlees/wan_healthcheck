[build-system]
# The runtime dependencies are build requirements too: mypyc type checks the
# module while compiling it, inside pip's isolated build environment where
# nothing from project.dependencies is importable. Without their real types
# here, strict mode fails the build (missing imports, then click's decorators
# degrading to untyped). Keep the pins in sync with project.dependencies.
requires = [
    "setuptools>=77",
    "mypy>=1.14",
    "aiohttp>=3.14.3",
    "click>=8.4.2",
    "mypy-extensions>=1.1.0",
    "prometheus-client>=0.26.0",
    "scapy>=2.7.0",
]
build-backend = "setuptools.build_meta"

[project]
name = "wan-healthcheck"
version = "2026.8.14"
description = "Fail a LAN over to a backup router when the WAN degrades but stays up"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{name = "Cooper Ry Lees", email = "me@cooperlees.com"}]
keywords = ["networking", "keepalived", "vrrp", "ipv6", "failover", "systemd-networkd"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: No Input/Output (Daemon)",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Networking :: Monitoring",
]
dependencies = [
    "aiohttp>=3.14.3",
    "click>=8.4.2",
    "mypy-extensions>=1.1.0",
    "prometheus-client>=0.26.0",
    "scapy>=2.7.0",
]

[project.urls]
Homepage = "https://github.com/cooperlees/wan_healthcheck"
Issues = "https://github.com/cooperlees/wan_healthcheck/issues"

[project.scripts]
wan_healthcheck = "wan_healthcheck:cli"

[tool.setuptools]
py-modules = ["wan_healthcheck"]

[tool.mypy]
strict = true
